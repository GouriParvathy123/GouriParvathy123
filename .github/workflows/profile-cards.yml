name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  # Generates stats / top-langs / pin cards and commits them straight
  # into this repo — no live Vercel request happens when your README loads.
  stats-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=FF6FCB&icon_color=C792EA&text_color=E0AAFF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut-vertical&langs_count=8&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=FF6FCB&text_color=E0AAFF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - healthcare-management-system
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=healthcare-management-system&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=FF6FCB&icon_color=C792EA&text_color=E0AAFF
          path: profile/pin-healthcare-management-system.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card - PixelPlayer
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=PixelPlayer&theme=tokyonight&hide_border=true&bg_color=00000000&title_color=FF6FCB&icon_color=C792EA&text_color=E0AAFF
          path: profile/pin-pixelplayer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile stat cards" || exit 0
          git push

  # Generates the snake animation AND the activity graph together, then
  # publishes both to the same "output" branch in one push (avoids the
  # two workflows overwriting each other's file on that branch).
  visuals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist-snake/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist-snake/github-contribution-grid-snake.svg

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=react-dark&hide_border=true&bg_color=00000000&color=E0AAFF&line=FF6FCB&point=FFFFFF&area=true
          output_path: dist-activity/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Each action above writes into its own folder to avoid a Docker
      # file-permission clash. This step (a plain shell, not a container)
      # merges both sets of SVGs into one dist/ folder to publish.
      - name: Merge outputs
        run: |
          mkdir -p dist
          cp dist-snake/*.svg dist/
          cp dist-activity/*.svg dist/

      - name: Push both SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
